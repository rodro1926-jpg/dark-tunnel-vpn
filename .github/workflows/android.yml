name: Dark Tunnel Android Build & Release CI

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK & Package Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses & Install Platform 36
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Debug Keystore
        run: |
          if [ ! -f "debug.keystore" ]; then
            echo "Generating debug keystore for build runner..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x gradlew

      - name: Assemble Debug APK
        run: |
          echo "Compiling Debug APK with Gradle Wrapper..."
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Verify and Prepare APK Outputs
        run: |
          mkdir -p build-artifacts
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "Debug APK built successfully!"
            ls -lh app/build/outputs/apk/debug/app-debug.apk
            cp app/build/outputs/apk/debug/app-debug.apk build-artifacts/DarkTunnel-VPN.apk
          else
            echo "Error: app-debug.apk not found!" && exit 1
          fi

      - name: Upload APK to Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DarkTunnel-VPN-APK
          path: build-artifacts/DarkTunnel-VPN.apk
          retention-days: 30

      - name: Run Unit Tests (Non-blocking)
        continue-on-error: true
        run: |
          echo "Running unit tests..."
          ./gradlew :app:testDebugUnitTest --no-daemon || true

      - name: Publish or Update GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: build-artifacts/DarkTunnel-VPN.apk
          tag_name: v1.0.0
          name: "Dark Tunnel VPN v1.0.0"
          draft: false
          prerelease: false
          body: |
            ### Dark Tunnel VPN v1.0.0 (Production Android Client)
            
            #### Direct APK Download:
            Download **`DarkTunnel-VPN.apk`** below to install directly on your Android phone.
            
            #### Supported Tunneling Protocols:
            - SSH Direct, SSH over SSL/TLS (Stunnel), SSH with HTTP Request Payload
            - Xray VMess, Xray VLESS, Trojan, Shadowsocks, SOCKS5, and DNSTT / SlowDNS
            - Advanced HTTP Request Payload Generator and Macro Engine
            - Real-time Traffic Counters (Download/Upload speeds, duration, ping latency)
            - Host Checker, IP Hunter, Ping Diagnostics, and DoH / DNS Tools
            - Per-App VPN filter (Bypass or Route specific apps)
            - AES-256-GCM Encrypted Provider Configuration Export
